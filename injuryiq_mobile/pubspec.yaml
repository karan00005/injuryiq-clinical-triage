name: injuryiq_mobile
description: "InjuryIQ AI - Clinical Injury Triage Mobile Application (Phase 3 MVP)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons for iOS styling fallback
  cupertino_icons: ^1.0.5

  # Network HTTP Client for FastAPI integration
  http: ^1.1.0

  # State Management & Helpers
  provider: ^6.0.5
  shared_preferences: ^2.2.0

  # Firebase Suite for Authentication & Persistence
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.0
  cloud_firestore: ^4.8.0
  google_sign_in: ^6.1.4

  # Icons & Visual Indicators
  lucide_icons: ^0.320.0
  google_fonts: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  # Asset setup for local diagrams (Anatomical SVG/PNG helpers)
  assets:
    - assets/images/
